[Fixes]

## Default ON. Jotunn's embedded 'minimapmanager' asset bundle ships its MinimapCompose shaders with D3D11 and Vulkan subprograms only — there is no Metal variant — so on macOS the overlay compose blit inside MinimapManager.DrawLayer fills the whole 2048x2048 overlay texture with the error colour, and because that texture is drawn full-rect over the large map AND the minimap, the entire world map renders magenta whenever any Jotunn MapOverlay is enabled (e.g. StarLevelSystem's distance rings and zone overlay). When true, that compose step is performed on the CPU instead, using no shader at all: each overlay is alpha-composited into a plugin-owned buffer with the same lerp(dst, src, src.a) Jotunn's shader used, and that buffer is uploaded to the overlay texture ONCE per redraw with no GPU readback anywhere in the path, so multi-overlay accumulation is preserved. Nothing is patched at all until a mod actually registers a Jotunn overlay. A stock-shader GPU substitute was tried first and abandoned — the only suitable built-in (Unlit/Transparent) is stripped from Valheim's build, and every other candidate either premultiplies, masks off alpha, or needs a vertex colour that Graphics.Blit does not supply. TRADE-OFF: Jotunn's 'if (fog.r == 1) alpha = 0' clause is not reproduced (it would cost a full 2048x2048 GPU readback per redraw, the exact cost this path exists to avoid), so overlay pixels are no longer hidden in unexplored terrain, and because that clause zeroed the ACCUMULATED alpha rather than just the incoming overlay's, a later fogged overlay no longer erases earlier overlays in fogged regions. Set to false to restore Jotunn's original path, which on macOS means the magenta map returns. REQUIRES A RESTART either way: this setting is read once when the hooks are installed and is never re-read, so changing it mid-session has no effect. Only the overlay compose is substituted; MapDrawings (ComposeMain/Height/Forest/Fog) is untouched and remains broken on Metal. No vanilla Valheim asset is modified.
# Setting type: Boolean
# Default value: true
Fix Jotunn Minimap Overlay = true

[General]

## How often (in seconds) to re-sweep all materials. The periodic sweep is now a safety net for unobserved bundle-load / prefab-spawn events; the primary mechanisms are Harmony postfixes on ZNetScene.Awake, Location.Awake, AssetBundle.Load*, VisEquipment.AttachItem, and the scene-load handler. Default raised to 600 s in v3.0.63 because the v2.1.17 admission-epoch skip-gate already short-circuits every periodic sweep on a stable scene; the cadence only matters when the safety cap (10 consecutive skips) forces a full sweep. Lower this (e.g. 120 or 30) if you run VFX-heavy mods that spawn materials frequently and you observe pink materials between sweeps. Set to 0 to disable the periodic timer entirely.
# Setting type: Single
# Default value: 600
Periodic Sweep Interval = 600

